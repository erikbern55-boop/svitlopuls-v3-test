name: Isolated V3 preview (no Telegram)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: isolated-v3-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated test repository
        uses: actions/checkout@v4
      - name: Checkout renderer test branch (never production deployment)
        uses: actions/checkout@v4
        with:
          repository: erikbern55-boop/dtek-schedule
          ref: feature/svitlopuls-v3-independent-generator
          path: renderer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: renderer/.nvmrc
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - name: Install renderer dependencies
        working-directory: renderer
        run: npm ci
      - name: Install Chromium for DTEK official source
        working-directory: renderer
        run: npx playwright install --with-deps chromium
      - name: Generate independent live JSON and card (no Telegram tokens)
        working-directory: renderer
        env:
          REGION: kr
          GROUP: '1.1'
        run: |
          cp ../live-generator.mjs ./live-generator.mjs
          node live-generator.mjs
          cp ../verify-live.mjs ./verify-live.mjs
          node verify-live.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/svitlopuls-live.json').read_text())
          assert d['date'] and d['group']=='1.1'
          assert 'generatedAt' in d and 'live' in d
          if d['live']:
              assert d['periods'][0]['begin']=='00:00'
              assert d['periods'][-1]['end']=='24:00'
          print('Test JSON:',d['date'],'live:',d['live'],'periods:',len(d['periods']))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: renderer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
