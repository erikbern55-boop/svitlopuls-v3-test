name: Isolated V3 preview (no Telegram)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: isolated-v3-pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch test branch of renderer only
        uses: actions/checkout@v4
        with:
          repository: erikbern55-boop/dtek-schedule
          ref: feature/svitlopuls-v3-independent-generator
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate standalone browser preview without Telegram
        run: node test/card-v3-smoke.js
      - name: Prepare explicitly labeled DEMO page
        run: |
          mkdir -p dist
          cp svitlopuls-v3-fullscreen-preview.html dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text()
          banner='<div style="position:sticky;top:0;z-index:9999;padding:12px;background:#6d3300;color:white;font:700 17px Arial;text-align:center">ТЕСТОВА КАРТКА · ДЕМО-ДАНІ 07.11.2026 · ЖИВИЙ ДТЕК НЕ ПІДКЛЮЧЕНО · НЕ ДЛЯ ПЛАНУВАННЯ ВІДКЛЮЧЕНЬ</div>'
          s=s.replace('<body>', '<body>'+banner,1)
          # Keep the approved 1404px composition; only scale the whole card.
          responsive = """<style>
          html,body{width:100%!important;min-width:0!important;overflow-x:auto!important;margin:0!important}
          .v3{width:1404px!important;max-width:none!important;transform:none!important;transform-origin:top left!important}
          #trial-tools{position:sticky;top:0;z-index:10000;display:flex;align-items:center;justify-content:center;gap:12px;background:#082218;color:#fff;padding:8px;font:16px Arial}
          #trial-tools button{border:1px solid #4dfd63;border-radius:8px;background:#113c27;color:white;padding:8px 14px;font:700 16px Arial}
          #trial-tools output{min-width:56px;text-align:center}
          </style>"""
          s=s.replace('</head>',responsive+'</head>',1)
          tools='<div id="trial-tools"><button type="button" id="trial-minus" aria-label="Зменшити масштаб">−</button><button type="button" id="trial-fit">За шириною</button><button type="button" id="trial-plus" aria-label="Збільшити масштаб">+</button><output id="trial-scale"></output></div>'
          s=s.replace('</body>',tools+"""<script>
          (function(){
            const card=document.querySelector('.v3');
            if(!card)return;
            const label=document.getElementById('trial-scale');
            let scale=1,manual=false;
            function apply(v){scale=Math.max(.2,Math.min(1.5,v));card.style.zoom=String(scale);label.textContent=Math.round(scale*100)+'%';}
            function fit(){manual=false;apply(Math.min(1,document.documentElement.clientWidth/1404));}
            document.getElementById('trial-minus').addEventListener('click',()=>{manual=true;apply(scale-.1);});
            document.getElementById('trial-plus').addEventListener('click',()=>{manual=true;apply(scale+.1);});
            document.getElementById('trial-fit').addEventListener('click',fit);
            window.addEventListener('resize',()=>{if(!manual)fit();});
            fit();
          })();
          </script></body>""",1)
          p.write_text(s)
          PY
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Enable and configure isolated GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish to isolated GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
